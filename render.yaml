services:
  - type: web
    name: nutricoach-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r nutricoach/backend/requirements.txt
      python nutricoach/backend/init_db.py
      python nutricoach/backend/seed_recipes.py
      cd nutricoach/frontend && npm install && npm run build
    startCommand: cd nutricoach/backend && python wsgi.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.11.0
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
