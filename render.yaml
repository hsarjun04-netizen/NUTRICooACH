services:
  - type: web
    name: nutricoach-ai
    runtime: python
    plan: free
    buildCommand: |
      cd nutricoach/backend && pip install -r requirements.txt
      cd ../frontend && npm install && npm run build
    startCommand: cd nutricoach/backend && python wsgi.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.11.0
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
