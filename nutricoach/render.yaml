services:
  - type: web
    name: nutricoach-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      # Install Python dependencies
      pip install -r backend/requirements.txt
      # Initialize database
      python backend/init_db.py
      python backend/seed_recipes.py
      # Build frontend (monorepo structure)
      npm install
      npm run build
    startCommand: cd backend && python wsgi.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.11.0
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
